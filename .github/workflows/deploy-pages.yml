name: Deploy Pages

on:
  push:
    branches:
      - main
      - claude/flitser-notification-app-ei41n2
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: flitser-app/package-lock.json

      - name: Install flitser-app dependencies
        working-directory: flitser-app
        run: npm ci

      - name: Build flitser-app (GitHub Pages subpath)
        working-directory: flitser-app
        env:
          GITHUB_PAGES: "true"
        run: npm run build

      - name: Assemble Pages site
        run: |
          mkdir -p _site
          # Personal portfolio at the site root (unchanged).
          cp index.html _site/ 2>/dev/null || true
          cp *.jpg _site/ 2>/dev/null || true
          # Flitser Alert app under /flitser/.
          mkdir -p _site/flitser
          cp -r flitser-app/dist/. _site/flitser/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
